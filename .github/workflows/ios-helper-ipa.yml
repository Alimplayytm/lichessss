name: iOS Chess Helper IPA

on:
  workflow_dispatch:
  push:
    branches: [ios-chess-helper]

permissions:
  contents: read

concurrency:
  group: ios-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml
      - name: Dependencies and generated code
        run: |
          flutter pub get
          dart run build_runner build
      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/src/model/board_api lib/src/view/board_api \
            lib/src/network/aggregator.dart lib/src/view/play/play_menu.dart \
            lib/src/view/game/game_screen.dart test/model/board_api test/view/board_api \
            test/model/auth/auth_repository_test.dart test/network/socket_test.dart \
            lib/src/model/chess_helper/chess_helper.dart \
            lib/src/model/chess_helper/chess_helper_preferences.dart \
            lib/src/model/auth/auth_diagnostics.dart \
            lib/src/model/auth/auth_user.dart \
            lib/src/model/auth/bearer.dart \
            lib/src/model/common/preloaded_data.dart \
            lib/src/network/http.dart lib/src/network/socket.dart \
            lib/src/service/correspondence_service.dart \
            lib/src/view/auth/personal_token_screen.dart \
            lib/src/view/auth/sign_in_options.dart \
            test/model/auth/personal_token_test.dart \
            test/view/auth/personal_token_screen_test.dart \
            lib/src/model/auth/auth_repository.dart \
            lib/src/model/auth/auth_controller.dart \
            lib/src/view/auth/sign_in_error.dart \
            lib/src/view/auth/email_login_screen.dart \
            test/model/auth/auth_diagnostics_test.dart \
            lib/src/model/settings/preferences_storage.dart \
            lib/src/widgets/board.dart \
            lib/src/widgets/chess_helper_board.dart \
            lib/src/widgets/game_layout.dart \
            lib/src/view/analysis/analysis_board.dart \
            test/model/chess_helper/chess_helper_test.dart \
            test/widgets/chess_helper_board_test.dart
      - name: Analyze edited files
        run: |
          flutter analyze \
            lib/src/model/board_api lib/src/view/board_api \
            lib/src/network/aggregator.dart lib/src/view/play/play_menu.dart \
            lib/src/view/game/game_screen.dart test/model/board_api test/view/board_api \
            test/model/auth/auth_repository_test.dart test/network/socket_test.dart \
            lib/src/model/chess_helper \
            lib/src/model/auth/auth_diagnostics.dart \
            lib/src/model/auth/auth_user.dart \
            lib/src/model/auth/bearer.dart \
            lib/src/model/common/preloaded_data.dart \
            lib/src/network/http.dart lib/src/network/socket.dart \
            lib/src/service/correspondence_service.dart \
            lib/src/view/auth/personal_token_screen.dart \
            lib/src/view/auth/sign_in_options.dart \
            test/model/auth/personal_token_test.dart \
            test/view/auth/personal_token_screen_test.dart \
            lib/src/model/auth/auth_repository.dart \
            lib/src/model/auth/auth_controller.dart \
            lib/src/view/auth/sign_in_error.dart \
            lib/src/view/auth/email_login_screen.dart \
            test/model/auth/auth_diagnostics_test.dart \
            lib/src/model/settings/preferences_storage.dart \
            lib/src/widgets/board.dart \
            lib/src/widgets/chess_helper_board.dart \
            lib/src/widgets/game_layout.dart \
            lib/src/view/analysis/analysis_board.dart \
            test/model/chess_helper test/widgets/chess_helper_board_test.dart
      - name: Test helper and engine
        run: |
          flutter test --dart-define=AUTH_DIAGNOSTICS=true \
            test/model/board_api test/view/board_api test/network/aggregator_test.dart \
            test/model/auth/personal_token_test.dart test/view/auth/personal_token_screen_test.dart \
            test/network/http_test.dart test/network/socket_test.dart \
            test/service/correspondence_service_test.dart \
            test/model/auth/auth_diagnostics_test.dart test/model/auth/auth_repository_test.dart \
            test/model/auth/auth_controller_test.dart test/view/auth/email_login_screen_test.dart \
            test/model/chess_helper test/widgets/chess_helper_board_test.dart \
            test/model/engine/engine_test.dart test/widgets/board_test.dart \
            test/model/model_layer_test.dart test/view/game/game_screen_test.dart \
            test/view/offline_computer/offline_computer_game_screen_test.dart \
            test/view/analysis/analysis_screen_test.dart
      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --build-number=3203 \
            --dart-define=AUTH_DIAGNOSTICS=true \
            --dart-define=LICHESS_HOST=lichess.org \
            --dart-define=LICHESS_WS_HOST=socket.lichess.org \
            --dart-define=LICHESS_WS_SECRET="${{ secrets.WS_SECRET }}"
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -qry lichess-helper-unsigned.ipa Payload
          unzip -tq lichess-helper-unsigned.ipa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lichess-public-board-api-unsigned-ipa
          path: build/ios/unsigned/lichess-helper-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
